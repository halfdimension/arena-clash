<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARENA CLASH</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050710;
        }
        body {
            display: grid;
            place-items: center;
        }
        canvas {
            width: min(100vw, calc(100vh * 16 / 9));
            height: min(100vh, calc(100vw * 9 / 16));
            outline: none;
        }
        #status {
            position: fixed;
            left: 1rem;
            bottom: 0.75rem;
            color: #78829c;
            font: 13px system-ui, sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading ARENA CLASH…</div>
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            setStatus: function (message) {
                var status = document.getElementById('status');
                if (!status) return;
                status.textContent = message;
                if (!message) status.remove();
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
